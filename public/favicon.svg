<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hexagon Badge -->
  <rect width="512" height="512" rx="128" fill="#030712" />
  
  <!-- Outer Glowing Hexagon Frame -->
  <path d="M256 48 L432 148 L432 364 L256 464 L80 364 L80 148 Z" 
        fill="#0f172a" 
        stroke="url(#cyanGrad)" 
        stroke-width="16" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Code brackets & R Logo Symbol -->
  <g transform="translate(136, 128)">
    <!-- Cyan Glowing stylized R -->
    <path d="M 50 40 
             L 120 40 
             C 165 40, 185 60, 185 95 
             C 185 130, 165 150, 120 150 
             L 95 150 
             L 170 240 
             M 95 40 
             L 95 240" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Terminal Prompt / Tech Accent dots -->
    <circle cx="195" cy="225" r="14" fill="#22d3ee" />
  </g>
</svg>
